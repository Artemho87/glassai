name: Собрать APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0
          cp app/build/outputs/apk/release/app-release.apk GlassAI.apk

      - name: Справка по API очков
        if: always()
        run: |
          mkdir -p apidump && cd apidump
          for a in $(find ~/.gradle -name "mwdat-*.aar" | grep -v mockdevice | grep -v display); do
            n=$(basename $a .aar); mkdir -p $n; unzip -q -o $a classes.jar -d $n || continue
            echo "##### $n" >> ../api.txt
            javap -p -cp $n/classes.jar $(unzip -Z1 $n/classes.jar | grep '^com/meta/wearable/dat/.*\.class$' | sed 's/\.class$//; s#/#.#g') >> ../api.txt 2>/dev/null || true
          done
          cd .. && touch api.txt build.log && wc -l api.txt

      - name: Лог сборки (при ошибке)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          name: Лог последней ошибки сборки
          files: |
            build.log
            api.txt

      - name: Файл сборки
        uses: actions/upload-artifact@v4
        with:
          name: GlassAI-apk
          path: GlassAI.apk

      - name: Выложить в Releases (ссылка для телефона)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Очки ИИ — последняя версия
          body: Скачай GlassAI.apk на телефон и установи.
          files: GlassAI.apk
          make_latest: true
