name: Собрать APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0
          cp app/build/outputs/apk/debug/app-debug.apk GlassAI.apk

      - name: Лог сборки (при ошибке)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          name: Лог последней ошибки сборки
          files: build.log

      - name: Файл сборки
        uses: actions/upload-artifact@v4
        with:
          name: GlassAI-apk
          path: GlassAI.apk

      - name: Выложить в Releases (ссылка для телефона)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Очки ИИ — последняя версия
          body: Скачай GlassAI.apk на телефон и установи.
          files: GlassAI.apk
          make_latest: true
